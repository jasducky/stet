<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northwick Analytics — result card</title>
<style>
  body { margin: 0; font-family: Georgia, serif; background: #f4f1ea; }
  .card { width: 520px; margin: 48px auto; background: #fff; padding: 36px; border-radius: 4px; }
  .eyebrow { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8a7f6a; }
  .figure { font-size: 64px; line-height: 1; margin: 16px 0; color: #1d2b1f; }
  .claim { font-size: 20px; color: #2f3a30; }
  .attrib { margin-top: 28px; font-size: 13px; color: #8a7f6a; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Fleet review, Q3</div>
    <div class="figure">41%</div>
    <div class="claim">of depot handovers were logged twice, once by the driver and once by the yard supervisor.</div>
    <div class="claim">Neither record was treated as the authoritative one.</div>
    <div class="attrib">Northwick Analytics, internal sample of 3,200 handovers</div>
    <div class="attrib">Figures are illustrative and invented for testing.</div>
  </div>
</body>
</html>
